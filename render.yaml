# FGMP — Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  # ── Main Next.js Web Application ───────────────────────────────────────────
  - type: web
    name: fgmp-app
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    # NEXT_PUBLIC_* are inlined at build time. The Dockerfile declares them as
    # ARGs, and Render exposes service environment variables to the Docker build
    # only when an ARG of the same name exists — so keep these declared if you
    # move realtime credentials around.
    # Unauthenticated readiness probe. /api/fgmp/health is ADMIN-only, so
    # pointing Render at it marked every healthy deploy as down.
    healthCheckPath: /api/health/ready
    envVars:
      - fromGroup: fgmp1  # Pulls all variables from your existing environment group
      - key: DATABASE_URL
        sync: false
      # Service-level empty value overrides any accidentally shared group
      # value. The web container must not receive the schema-owner credential.
      - key: FGMP_MIGRATE_DATABASE_URL
        value: ""
      - key: FGMP_MIGRATE_ONLY
        value: "0"
      # Migrations are a one-shot job; the web entrypoint only preflights the
      # app-role connection and starts the server.
      - key: FGMP_SKIP_MIGRATE
        value: "1"
      # Keep RLS enforcement on. The managed database must expose a
      # non-owner `fgmp_app` role (see docs/DEPLOYMENT.md); disabling this
      # would let an owner-role connection bypass every tenant policy.
      - key: FGMP_REQUIRE_RLS
        value: "1"
      - key: NEXTAUTH_URL
        sync: false
      # Hosted realtime (Apinator). REALTIME_URL is gone with the retired
      # self-hosted socket.io service; credentials come from the Apinator
      # dashboard and CLUSTER is the data-plane region (eu|us).
      - key: APINATOR_APP_ID
        sync: false
      - key: APINATOR_KEY
        sync: false
      - key: APINATOR_SECRET
        sync: false
      - key: APINATOR_CLUSTER
        sync: false

  # ── One-shot migration job ─────────────────────────────────────────────────
  # Manual ("Run job") after every deploy that adds a migration. This is the
  # ONLY service that receives the owner URL, and it exits when done.
  - type: job
    name: fgmp-migrate
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      # The migration job receives only its dedicated schema-owner credential;
      # the entrypoint maps it to DATABASE_URL for Prisma and exits after deploy.
      - key: FGMP_MIGRATE_DATABASE_URL
        sync: false
      - key: FGMP_MIGRATE_ONLY
        value: "1"

  # ── IoT Telemetry Bridge ───────────────────────────────────────────────────
  # NOTE: there is deliberately NO fgmp-realtime service here any more. The
  # self-hosted socket.io mini-service was retired; realtime is hosted by
  # Apinator and reached directly by browsers, so no container is deployed
  # for it.
  - type: web
    name: fgmp-iot-bridge
    env: docker
    dockerfilePath: mini-services/iot-bridge/Dockerfile
    dockerContext: mini-services/iot-bridge
    plan: free
    envVars:
      - fromGroup: fgmp1
      # This bridge calls the app API and has no direct database client; strip
      # any shared database credentials rather than passing unused secrets.
      - key: DATABASE_URL
        value: ""
      - key: FGMP_MIGRATE_DATABASE_URL
        value: ""
      - key: FGMP_OPS_DATABASE_URL
        value: ""
      - key: FGPS_OPS_DATABASE_URL
        value: ""
      - key: NEXT_API_BASE
        sync: false
