# FGMP — Render Blueprint Specification
# https://render.com/docs/blueprint-spec

services:
  # ── Main Next.js Web Application ───────────────────────────────────────────
  - type: web
    name: fgmp-app
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    # healthCheckPath: /api/fgmp/health
    envVars:
      - fromGroup: fgmp1  # Pulls all variables from your existing environment group
      - key: DATABASE_URL
        sync: false
      - key: FGMP_MIGRATE_DATABASE_URL
        sync: false
      - key: FGMP_REQUIRE_RLS
        value: "0"
      - key: NEXTAUTH_URL
        sync: false
      # Hosted realtime (Apinator). REALTIME_URL is gone with the retired
      # self-hosted socket.io service; credentials come from the Apinator
      # dashboard and CLUSTER is the data-plane region (eu|us).
      - key: APINATOR_APP_ID
        sync: false
      - key: APINATOR_KEY
        sync: false
      - key: APINATOR_SECRET
        sync: false
      - key: APINATOR_CLUSTER
        sync: false

  # ── IoT Telemetry Bridge ───────────────────────────────────────────────────
  # NOTE: there is deliberately NO fgmp-realtime service here any more. The
  # self-hosted socket.io mini-service was retired; realtime is hosted by
  # Apinator and reached directly by browsers, so no container is deployed
  # for it.
  - type: web
    name: fgmp-iot-bridge
    env: docker
    dockerfilePath: mini-services/iot-bridge/Dockerfile
    dockerContext: mini-services/iot-bridge
    plan: free
    envVars:
      - fromGroup: fgmp1
      - key: NEXT_API_BASE
        sync: false
