# Mosquitto dev/test broker for FGMP — per-tenant ACL.
#
# ── WHY THIS FILE EXISTS ─────────────────────────────────────────────────────
# MQTT has no database, so PostgreSQL Row Level Security cannot protect it. The
# ONLY thing that can is the broker refusing an operation. That means the
# tenant boundary has to be expressed HERE, as an ACL the broker enforces, and
# not as a filter in application code.
#
# The distinction is the whole point, and it is worth stating precisely:
#
#   "our code filters"    a single connection subscribed to fgmp/# that discards
#                         messages from other tenants in a client-side `if`.
#                         One bug — a missing filter, a refactor that drops it,
#                         a new subscriber that forgets — and the isolation is
#                         gone, silently, with a green test suite.
#
#   "the broker refuses"  each tenant connects with its OWN credentials, and
#                         the ACL below denies subscribe to any topic outside
#                         that tenant's own subtree. Tenant A asking for
#                         fgmp/tenant-b/# receives "not authorised" from the
#                         BROKER. No client-side mistake can widen it, because
#                         the denial does not happen in our code at all.
#
# Topic shape (see src/lib/fgmp/protocol/mqtt.ts):
#     fgmp/<tenantId>/<deviceKind>/<deviceId>/<channel>
#
# The ACL grants the single pattern `fgmp/<tenant>/#` per tenant. There is no
# wildcard spanning two tenants, which is what makes the boundary structural
# rather than a runtime decision.

# ─────────────────────────────────────────────────────────────────────────────
# HOW TENANT ISOLATION IS ACTUALLY ENFORCED — READ THIS BEFORE EDITING
# ─────────────────────────────────────────────────────────────────────────────
#
# In mosquitto 2.x an ACL is attached to a LISTENER, not to the process.
# Security directives written ABOVE a `listener` block configure the implicit
# default listener — which is not being served once an explicit listener
# exists. The result is a broker that starts cleanly, logs nothing wrong,
# authenticates every user correctly, and enforces NO authorization at all.
#
# That is exactly what this broker did. `tenant-a` could subscribe to
# `fgmp/tenant-b/#`, to `$SYS/#`, and to `zzz/nope` — every one granted —
# while the container reported healthy, while the ACL file sat in the config
# greppable and looking correct, and while the password file was being read
# for authentication by the very same mechanism. Found only because the
# cross-tenant subscribe tests failed against a broker that looked perfect.
#
# Three arrangements were tried. Two of them LOOK correct and are not; both
# were verified against the shipped binary rather than trusted from docs.
#
#   1. Unprefixed directives above the listener.  Silently applies no ACL.
#   2. `per_listener_settings true` placed after `password_file`. Mosquitto
#      rejects the config outright:
#        Error: per_listener_settings must be set before any other security settings.
#      Loud, but not a working configuration.
#
#   3. `listener_allow_anonymous` / `listener_password_file` / `listener_acl_file`.
#      Only the FIRST exists in mosquitto 2.1.2 — there is no per-listener ACL
#      directive at all. Verified by inspecting the binary:
#        docker run --rm --entrypoint sh eclipse-mosquitto:2 -c \
#          'strings /usr/sbin/mosquitto | grep -x "listener_[a-z_]*" | sort -u'
#        listener_allow_anonymous
#        listener_auto_id_prefix
#      and mosquitto refuses to start with
#        Error: Unknown configuration variable 'listener_password_file'.
#      This is the most dangerous of the three, since the name is exactly what
#      the documentation suggests and the failure is a plain unknown variable.
#
# WHAT ACTUALLY WORKS is the arrangement below, verified end to end:
# per_listener_settings true as the FIRST directive, then the ordinary
# unprefixed security directives placed AFTER the listener block. Scoping then
# attaches them to the declared listener rather than to the unused default one.
#
# TO VERIFY ISOLATION IS REALLY ON, after ANY change to this file:
#   docker compose up -d --force-recreate fgmp-broker
#   docker exec fgmp-broker mosquitto_sub -h 127.0.0.1 -u tenant-a \
#     -P dev-tenant-a-pw -t 'fgmp/tenant-a/#' -t 'fgmp/tenant-b/#' -d -W 2 \
#     | grep Subscribed
# Expect `Subscribed (mid: 1): 0, 128` — own subtree granted, foreign DENIED.
# Anything else, especially `0, 0`, means isolation is off and every tenant can
# read every other tenant's telemetry while appearing perfectly healthy.
per_listener_settings true

# ─────────────────────────────────────────────────────────────────────────────
# LISTENER
# ─────────────────────────────────────────────────────────────────────────────
# Bind 0.0.0.0 INSIDE the container, not 127.0.0.1.
#
# This is not a contradiction of "development only" — reachability is
# controlled by the published port mapping in docker-compose.yml, which is
# `127.0.0.1:1885:1883`. Binding loopback inside the container instead makes
# every external connection hang then drop at the TCP layer, while clients on
# the same container succeed — a failure mode that looks exactly like an MQTT or
# credential bug and is genuinely hard to diagnose. Verified: with
# `listener 1883 127.0.0.1`, mosquitto_sub inside the container returned CONNACK
# and every client outside got a silent close.
#
# A real deployment would terminate TLS here.
listener 1883 0.0.0.0
protocol mqtt

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY SETTINGS — AFTER THE LISTENER, ON PURPOSE
# ─────────────────────────────────────────────────────────────────────────────
# Because per_listener_settings is true, these attach to the listener above.
# Moving them above it — which reads naturally and looks harmless — is what
# produced a broker that authenticated everyone and authorized no one.
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Anonymous connections are refused outright. An anonymous client can never be
# matched against a per-user ACL rule, so allowing it would silently grant
# whatever the catch-all rule says — which is how broker ACLs fail open.
allow_anonymous false

# Per-connection rate limiting, so one tenant cannot starve the others.
max_connections -1
max_inflight_messages 20

# Reasonable queue limits for offline sessions.
max_queued_messages 1000

# Log to stdout so a test can assert on a denial being emitted by the broker.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Retained messages are required for device availability (LWT status), so they
# stay enabled.
persistence false