name: CI

# This workflow is the gate that was missing. Until now `eslint` exited 0
# because every meaningful rule was disabled, `next build` skipped type
# checking via `ignoreBuildErrors`, and nothing ran `tsc` at all — so 157 type
# errors, a set of Prisma columns that don't exist, and two routes calling
# engine methods that were never implemented all shipped to production.

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `checks: write` is what lets the diagnostics step below publish the failing
# step's log back onto the commit. Without it a failed build is a red X with no
# readable output (the log archive is behind a separate, authenticated host).
permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public

      # ── The type gate ────────────────────────────────────────────────────
      # Zero errors required. This is what catches a route reading a column
      # the model doesn't define, or a call to a method that doesn't exist,
      # before they become 500s in production.
      - name: Typecheck (must be zero errors)
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/typecheck.log

      # ── The lint gate ────────────────────────────────────────────────────
      # Errors fail the build; warnings are reported but do not block (there is
      # a known backlog in exhaustive-deps / no-explicit-any, tracked as
      # warnings so new violations are visible without blocking PRs).
      - name: Lint
        run: bun run lint

      # ── Schema validity ──────────────────────────────────────────────────
      - name: Validate Prisma schema
        run: bunx prisma validate
        env:
          DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public

      # ── The unit-test gate ───────────────────────────────────────────────
      # Phase 5, P0-6. Twelve test files and a `test` script existed while CI
      # ran typecheck/lint/validate/build and never invoked them, so nothing
      # mechanically prevented a regression. That is exactly the failure mode
      # that let this codebase reach a state where "feature-complete" was
      # claimed without a single test ever having run.
      #
      # `bun test` runs the whole suite: pure unit tests (decimal conversion,
      # interlocks, control scope, protocol framing) plus the in-process suites
      # under __tests__. No database is required — the suites that need
      # PostgreSQL live in the `rls` job below, which provisions a real server.
      - name: Unit tests (must be zero failures)
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/test.log

      # ── The production build ─────────────────────────────────────────────
      # Runs with `typescript.ignoreBuildErrors: false`, so a type error fails
      # here too, and it proves the standalone output the Dockerfile depends
      # on is actually produced.
      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/build.log
        env:
          DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public
          NEXT_TELEMETRY_DISABLED: "1"

      # Diagnostics: publish the tail of the test and build logs onto the
      # commit through the Checks API. `gh run view --log` is served from a
      # different host than the API and is not always reachable; a check run is.
      - name: Publish failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 scripts/ci/publish-logs.py "verify: typecheck + test + build logs"
          /tmp/typecheck.log /tmp/test.log /tmp/build.log

  # The realtime service and the IoT bridge are separate Bun projects with their
  # own lockfiles and are NOT covered by the app build, so they get their own
  # typecheck. They were excluded from every gate until now.
  mini-services:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [iot-bridge]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install
        working-directory: mini-services/${{ matrix.service }}
        run: bun install --frozen-lockfile

      # Both services now ship a tsconfig.json, so this gate actually runs.
      # It previously ended in `|| echo "no tsconfig — skipped"`, which meant a
      # green checkmark over 775 lines of socket.io and device-ingest code that
      # had never been type-checked: a missing tsconfig and a clean build were
      # indistinguishable in CI. There is no fallback branch now, so a missing
      # tsconfig or a real type error both fail the job.
      - name: Typecheck
        working-directory: mini-services/${{ matrix.service }}
        run: bunx tsc --noEmit --skipLibCheck

  # ── RLS backstop ──────────────────────────────────────────────────────────
  # The isolation guarantee is enforced by the DATABASE, so it can only be
  # proven against a real PostgreSQL instance with the policies applied. This
  # job boots Postgres, applies every migration, then runs the smoke test and
  # the RLS regression suite as the non-owner app role.
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [verify]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: fgmp_migrate
          POSTGRES_PASSWORD: cimigrate
          POSTGRES_DB: fgmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fgmp_migrate -d fgmp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public
      FGMP_MIGRATE_DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The seed, the smoke test and the database-backed suites all import
      # @prisma/client, and an ungenerated client fails at import with
      # `Cannot find module '.prisma/client/default'`. The migrations below do
      # NOT need it (the CLI reads schema.prisma), which is why this job got as
      # far as seeding before failing — so generate explicitly.
      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public

      # ── Roles BEFORE migrations ────────────────────────────────────────
      # All three roles must exist first. The second committed migration does
      # `GRANT … TO fgmp_app, fgmp_ops`; with only fgmp_app created, `migrate
      # deploy` dies there with `role "fgmp_ops" does not exist`, which is
      # exactly what this job did the first time it was ever allowed to run
      # (it had been skipped behind a failing `verify` since it was written).
      #
      # The provisioning SQL is the SAME file docker-compose mounts into
      # /docker-entrypoint-initdb.d, not a copy: a CI role setup that drifts
      # from the deployed one would test a database nobody runs.
      - name: Provision database roles
        run: |
          PGPASSWORD=cimigrate psql -h 127.0.0.1 -U fgmp_migrate -d fgmp -v ON_ERROR_STOP=1 \
            --set=app_password=ciapp \
            --set=ops_password=ciops \
            --set=migrate_password=cimigrate \
            -f scripts/db/pg-init-roles.sql

      # Migrations run as the OWNER. `prisma migrate deploy` reads DATABASE_URL,
      # and the job-level DATABASE_URL is the app's RLS role — which is not the
      # schema owner and cannot run DDL. Passing the app URL here would fail
      # with a permission error that looks like a broken migration.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public
        run: |
          set -o pipefail
          bunx prisma migrate deploy 2>&1 | tee /tmp/migrate.log

      # The migration grants DML itself (20261004203149_grant_role_privileges),
      # so this step is deliberately NOT repeated here: if the migration stops
      # granting, CI must fail rather than paper over it with a compensating
      # GRANT. That is the difference between testing the deployment and
      # testing a database nobody deploys.
      #
      # Seeding is a deploy-time step (Phase 1 step 6 removed it from
      # bootstrap()), so CI must do it explicitly — exactly as an operator would,
      # with the owner credential the deploy-time job holds.
      - name: Seed (deploy-time step, owner role)
        env:
          FGMP_MIGRATE_DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public
        run: |
          set -o pipefail
          bun run db:seed 2>&1 | tee /tmp/seed.log

      # Proves the schema works at runtime AND that the policies are live: the
      # smoke test asserts an unscoped app-role read returns zero rows.
      - name: PostgreSQL smoke test (non-destructive, asserts RLS is enforcing)
        run: |
          set -o pipefail
          bun run test:smoke 2>&1 | tee /tmp/smoke.log

      # The database-backed suites, run where the database actually exists.
      # `verify` runs `bun test` without one, so these were skipped there; until
      # now nothing ran them in CI at all. FGMP_REQUIRE_DB_TESTS=1 turns the
      # skip into a failure, so a broken pipeline cannot quietly stop testing
      # RLS behaviour.
      - name: Database-backed suites (strict — skips are failures)
        run: |
          set -o pipefail
          FGMP_REQUIRE_DB_TESTS=1 bun test 2>&1 | tee /tmp/dbtests.log
        env:
          DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public
          FGMP_MIGRATE_DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public

      # The isolation proof: every tenant-carrying table (currently 36),
      # deliberately unguarded queries that must not leak. Exits non-zero on any
      # failure.
      - name: RLS regression suite
        run: |
          set -o pipefail
          bun run test:rls 2>&1 | tee /tmp/rls.log

      # The instrument itself has to be proven, not just the property it
      # measures. `pooler-rls-proof.ts` is the script an operator runs against
      # their real pooler to close the Hyperdrive question; nothing in this
      # repository has ever executed it. Running it here against the DIRECT
      # endpoint is the control: if the four assertions fail on a database this
      # job just migrated and seeded, the script is wrong and any operator
      # running it against a pooler would get a false verdict.
      #
      # This does NOT prove the pooler. CI has no route to it and no
      # credentials — that run is still the operator's, and the ledger says so.
      - name: Pooler RLS proof — control run on the direct endpoint
        run: |
          set -o pipefail
          bun run scripts/verify/pooler-rls-proof.ts 2>&1 | tee /tmp/pooler-proof.log
        env:
          DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public

      - name: Publish failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 scripts/ci/publish-logs.py "rls: migration + isolation logs"
          /tmp/migrate.log /tmp/seed.log /tmp/smoke.log /tmp/dbtests.log /tmp/rls.log /tmp/pooler-proof.log

  # ── The HOSTED provisioning path ────────────────────────────────────────
  # `scripts/supabase/{01..04}.sql` are what a customer runs against Supabase,
  # Neon or RDS when they have no route to Prisma's engine. Nothing ran them in
  # CI: the `rls` job provisions the docker path (pg-init-roles.sql + migrate
  # deploy) as a superuser, which is a different set of statements with different
  # privileges. So 01-roles.sql shipped a statement that needs a superuser, and a
  # real deployment died at line 117 with `permission denied to change default
  # privileges` — followed by `permission denied to set role "fgmp_migrate"` in
  # 02 and the same in 04.
  #
  # This job reproduces the hosted shape and asserts the whole chain, including
  # that the role it all runs as is NOT a superuser — otherwise every statement
  # below would pass for the wrong reason. See scripts/verify/supabase-provisioning.ts.
  provisioning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [verify]

    services:
      postgres:
        # Plain PostgreSQL, not TimescaleDB: the schema's Timescale block is
        # commented out and the hosted path must work on stock PG.
        image: postgres:17
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A superuser ONLY to create the non-superuser provisioner and a database
      # owned by it. After that the scripts run as `fgmp_provisioner`.
      FGMP_PG_ADMIN_URL: postgresql://ci_admin:ci_admin@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Confirm the client is available
        run: psql --version

      - name: Hosted provisioning contract (non-superuser, 01 → 04)
        run: |
          set -o pipefail
          bun run test:provisioning 2>&1 | tee /tmp/provisioning.log

      - name: Publish failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 scripts/ci/publish-logs.py "provisioning: supabase scripts"
          /tmp/provisioning.log

  # ── Real browser, real database, real session ───────────────────────────
  # `tests/e2e/ui.spec.ts` has two halves. The public half (sign-in surface:
  # keyboard, RTL, eight viewports, axe) runs anywhere. The authenticated half
  # cannot be faked into meaning anything: navigation history, the mobile nav
  # dialog, and "READONLY receives no admin navigation" only exist once a real
  # session exists over a seeded database. This job provides that.
  #
  # Playwright is installed into `.pw/`, NOT into package.json: it is tooling
  # for this one job, and ~40 MB of browser automation should not be pulled by
  # every `bun install` or baked into the application image.
  ui:
    runs-on: ubuntu-latest
    # Raised from 30: this job renders all 27 views twice over (ADMIN and the
    # four screens whose rendering differs for SUPERADMIN) — 30 page loads with
    # axe on each — and now does the whole thing AGAIN in Arabic/RTL, another 29
    # page loads. Measured: LTR ~7 min, so budget ~2x that for the sweeps plus
    # the unchanged build and browser install.
    timeout-minutes: 45
    needs: [verify]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fgmp_migrate
          POSTGRES_PASSWORD: cimigrate
          POSTGRES_DB: fgmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fgmp_migrate -d fgmp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public
      FGMP_OPS_DATABASE_URL: postgresql://fgmp_ops:ciops@127.0.0.1:5432/fgmp?schema=public
      FGMP_MIGRATE_DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public
      FGMP_REQUIRE_RLS: "1"
      NEXTAUTH_SECRET: ci-e2e-secret-ci-e2e-secret-ci-e2e
      NEXTAUTH_URL: http://127.0.0.1:3000
      # The seeded accounts ship with published passwords, and `next start` runs
      # with NODE_ENV=production — where those passwords are refused by design.
      # This flag exists for exactly this: a non-production test deployment.
      FGMP_ALLOW_DEMO_CREDENTIALS: "1"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      FGMP_E2E_AUTH: "1"
      PW_HOME: ${{ github.workspace }}/.pw

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public

      # Same role file the deployment uses — not a CI-specific copy.
      - name: Provision database roles
        run: |
          PGPASSWORD=cimigrate psql -h 127.0.0.1 -U fgmp_migrate -d fgmp -v ON_ERROR_STOP=1 \
            --set=app_password=ciapp \
            --set=ops_password=ciops \
            --set=migrate_password=cimigrate \
            -f scripts/db/pg-init-roles.sql

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public
        run: bunx prisma migrate deploy

      - name: Seed
        run: bun run db:seed

      - name: Build the standalone server
        run: |
          set -o pipefail
          bun run build:standalone 2>&1 | tee /tmp/build.log
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright and a browser (into .pw/, not package.json)
        run: |
          mkdir -p "$PW_HOME"
          printf '{"name":"fgmp-e2e-tools","private":true}\n' > "$PW_HOME/package.json"
          npm --prefix "$PW_HOME" install --no-audit --no-fund @playwright/test@1.64.1 axe-core@4.10.2
          "$PW_HOME/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start the server
        run: |
          node .next/standalone/server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health/live > /dev/null 2>&1; then
              echo "server up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "server did not become ready"; tail -50 /tmp/server.log; exit 1

      # The UI sweep checks the rendered surfaces. This separate HTTP walk calls
      # every view endpoint and write-control probe as each of the seven roles;
      # unlike the browser sweep it verifies direct API authorization. Rate-limit
      # responses are inconclusive and fail the walk rather than counting as a
      # match. Run first against a fresh server so the browser suite cannot
      # consume the per-user test budgets.
      - name: Live seven-role API authorization walk
        run: |
          mkdir -p test-results
          set -o pipefail
          bun run test:rbac-walk -- --md test-results/rbac-live-walk.md --json test-results/rbac-live-walk.json 2>&1 | tee /tmp/rbac-live-walk.log
        env:
          FGMP_BASE_URL: http://127.0.0.1:3000

      # This second matrix probes representative method/policy shapes in the
      # route contract. The first walk creates the disposable READONLY demo user.
      # Each role gets its own seeded credential; these are CI-only demo values.
      - name: Live representative API policy matrix
        run: |
          set -o pipefail
          bun run test:authz:live -- --json test-results/authz-live.json 2>&1 | tee /tmp/authz-live.log
        env:
          FGMP_BASE_URL: http://127.0.0.1:3000
          FGMP_AUTHZ_PASSWORD_SUPERADMIN: Super@2026
          FGMP_AUTHZ_PASSWORD_ADMIN: Admin@2026
          FGMP_AUTHZ_PASSWORD_NOC_OPERATOR: Admin@2026
          FGMP_AUTHZ_PASSWORD_REGIONAL_MANAGER: Admin@2026
          FGMP_AUTHZ_PASSWORD_FIELD_ENGINEER: Admin@2026
          FGMP_AUTHZ_PASSWORD_EXECUTIVE: Admin@2026
          FGMP_AUTHZ_PASSWORD_READONLY: Readonly@2026

      - name: Upload live authorization reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-live-walk
          path: |
            test-results/rbac-live-walk.md
            test-results/rbac-live-walk.json
            test-results/authz-live.json
          if-no-files-found: warn

      # `github` as well as `list`: the list reporter's output lives in the job
      # log, which the Actions log archive serves from a host this project's
      # sandbox cannot reach, so a red run there is a red run with no readable
      # cause. The github reporter turns each failure into an annotation on the
      # check run, and annotations are on api.github.com.
      - name: Browser suite (public + authenticated)
        run: |
          set -o pipefail
          NODE_PATH="$PW_HOME/node_modules" \
          AXE_PATH="$PW_HOME/node_modules/axe-core/axe.min.js" \
          node "$PW_HOME/node_modules/@playwright/test/cli.js" test --reporter=list,github 2>&1 | tee /tmp/ui.log

      # The per-view sweep writes a table of what every screen did (axe, HTTP,
      # overflow, tiny-text count). It is published whether the run passed or
      # failed: on a pass it is the evidence, on a failure it is the diagnosis,
      # and reading it from the job log alone means re-running to see it again.
      - name: Upload the per-view sweep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views-report
          # Two sweeps now: LTR (the default language) and RTL (Arabic). The RTL
          # one is new — it is the first time the 27 views have ever been
          # rendered in the direction half the product is written for.
          path: |
            test-results/views-report.md
            test-results/views-rtl-report.md
          if-no-files-found: warn

      - name: Publish failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 scripts/ci/publish-logs.py "ui: browser suite"
          /tmp/build.log /tmp/server.log /tmp/rbac-live-walk.log /tmp/authz-live.log /tmp/ui.log


  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [verify]

    services:
      postgres:
        image: timescale/timescaledb:latest-pg17
        env:
          POSTGRES_USER: fgmp_migrate
          POSTGRES_PASSWORD: cimigrate
          POSTGRES_DB: fgmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fgmp_migrate -d fgmp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Proves the image actually builds and boots. Phase 1 migrated the app
      # from SQLite to PostgreSQL, so this now runs the container against the
      # Postgres service and applies migrations on a fresh volume — there is no
      # longer a local db file to mount.
      - name: Build image
        run: docker build -t fgmp:ci .

      # The container migrates as fgmp_migrate, and the migrations grant
      # privileges to fgmp_app and fgmp_ops. Those roles have to exist first —
      # the image cannot create them, because the entrypoint deliberately never
      # runs DDL beyond the committed migrations. Same provisioning file the
      # compose stack mounts, so CI and a real deployment start from one
      # definition.
      - name: Provision database roles
        run: |
          PGPASSWORD=cimigrate psql -h 127.0.0.1 -U fgmp_migrate -d fgmp -v ON_ERROR_STOP=1 \
            --set=app_password=ciapp \
            --set=ops_password=ciops \
            --set=migrate_password=cimigrate \
            -f scripts/db/pg-init-roles.sql

      # NOTE the credential split: the web container gets the OPS role (BYPASSRLS,
      # needed for the cross-tenant "email → user" lookup at sign-in) and the
      # MIGRATE role for the boot-time preflight — but `src/lib/env.ts` refuses to
      # start in production without one of them, because an app that cannot read
      # "User" cannot authenticate anybody. It did exactly that when this job was
      # first run with the flag in place: `FGMP_OPS_DATABASE_URL is not set …`.
      - name: Boot against PostgreSQL and apply migrations
        run: |
          set -o pipefail
          (
          docker run -d --name fgmp-ci -p 3000:3000 \
            --network host \
            -e DATABASE_URL=postgresql://fgmp_app:ciapp@127.0.0.1:5432/fgmp?schema=public \
            -e FGMP_OPS_DATABASE_URL=postgresql://fgmp_ops:ciops@127.0.0.1:5432/fgmp?schema=public \
            -e FGMP_MIGRATE_DATABASE_URL=postgresql://fgmp_migrate:cimigrate@127.0.0.1:5432/fgmp?schema=public \
            -e NEXTAUTH_SECRET=ci-secret-abcdefghijklmnopqrstuvwxyz0123456789 \
            -e IOT_API_KEY=ci-iot-key-abcdefghijklmnop \
            -e REALTIME_SERVICE_TOKEN=ci-svc-token-abcdefghij \
            fgmp:ci

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then
              echo "app is up after ${i} checks"
              docker logs fgmp-ci
              break
            fi
            sleep 2
          done

          # Readiness must be positive: the app is talking to PostgreSQL AND the
          # migrations are applied. A 503 here means the container started
          # against a database it cannot serve.
          docker exec fgmp-ci sh -c "bun -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(t=>console.log(t))\"" \
            | grep -q '"status":"ready"' \
            || { echo "FAIL: /api/health/ready is not ready"; docker logs fgmp-ci; exit 1; }
          PGPASSWORD=cimigrate psql -h 127.0.0.1 -U fgmp_migrate -d fgmp -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" \
            | grep -Eq '^[1-9][0-9]*$' \
            || { echo "FAIL: schema was not applied"; exit 1; }

          # RLS must be live on every tenant-carrying table in the container's DB.
          enabled=$(PGPASSWORD=cimigrate psql -h 127.0.0.1 -U fgmp_migrate -d fgmp -tAc \
            "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
             WHERE n.nspname='public' AND c.relkind='r' AND c.relrowsecurity AND c.relforcerowsecurity")
          [ "$enabled" -ge 36 ] \
            || { echo "FAIL: expected at least 36 FORCE-RLS tables, found $enabled"; exit 1; }

          # Must not have baked .env into the image.
          docker exec fgmp-ci sh -c "test ! -f /app/.env" \
            || { echo "FAIL: .env is present in the image"; exit 1; }

          # Must run as a non-root user.
          uid=$(docker exec fgmp-ci id -u)
          [ "$uid" != "0" ] || { echo "FAIL: container runs as root"; exit 1; }
          ) 2>&1 | tee /tmp/docker-boot.log

      # Container logs explain a failed boot better than anything the runner
      # says, so capture them before the container is removed. The entrypoint
      # prints the migration output verbatim.
      - name: Capture container logs
        if: always()
        run: |
          docker logs fgmp-ci > /tmp/docker-container.log 2>&1 || true
          docker inspect fgmp-ci > /tmp/docker-inspect.json 2>&1 || true
          tail -50 /tmp/docker-container.log || true

      - name: Publish failure diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 scripts/ci/publish-logs.py "docker: boot + migration logs"
          /tmp/docker-boot.log /tmp/docker-container.log

      - name: Cleanup
        if: always()
        run: docker rm -f fgmp-ci || true
