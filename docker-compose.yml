# FGMP — production stack
#
# Every secret below is REQUIRED and has no fallback. The previous defaults
# (dev-secret-change-me, fgmp-iot-dev-key) shipped in this file and in the
# firmware source, so a deployment that forgot to export them ran on publicly
# known credentials. `${VAR:?message}` makes `docker compose up` fail loudly
# instead.
#
# Generate the secrets once and keep them in your shell / secret manager:
#   openssl rand -base64 32   # NEXTAUTH_SECRET
#   openssl rand -hex 32      # IOT_API_KEY, REALTIME_SERVICE_TOKEN
#
# APINATOR_* values are NOT openssl-generated: APP_ID / KEY / SECRET come from
# the Apinator dashboard (hosted realtime), and CLUSTER is the data-plane
# region ("eu" or "us"). Browsers receive only the public pair
# NEXT_PUBLIC_APINATOR_APP_KEY / NEXT_PUBLIC_APINATOR_CLUSTER.

services:
  # ── PostgreSQL (Phase 1, step 1: SQLite → PostgreSQL) ────────────────────
  # Replaces the SQLite file that backed every model. TimescaleDB is included
  # from step 10 (SensorReadings hypertables); until then this is plain
  # PostgreSQL and the extension is simply unused.
  #
  # THREE ROLES, provisioned on first init by scripts/pg-init-roles.sh:
  #   fgmp_app     — DML only, NOT the table owner, so RLS is enforced (step 6)
  #   fgmp_ops     — BYPASSRLS for internal ops (pg_dump, support investigations)
  #   fgmp_migrate — owns the schema; CI only
  #
  # NOTE: the web app connects as fgmp_app and MUST NOT be given fgmp_ops.
  # If the app ever holds a BYPASSRLS role, one injection bug anywhere would
  # defeat tenant isolation completely. See scripts/pg-init-roles.sql.
  # ── MQTT broker with per-tenant ACLs ─────────────────────────────────────
  # MQTT has no database, so PostgreSQL RLS cannot protect it. The ONLY thing
  # that can is the broker refusing an operation, which is why this service
  # ships an ACL file rather than relying on client-side filtering:
  #
  #   "our code filters"   one connection on fgmp/# that discards other
  #                        tenants' messages in an `if`. One refactor and the
  #                        isolation is gone, silently, with green tests.
  #   "the broker refuses" each tenant connects with its OWN credentials and
  #                        the ACL denies any topic outside its own subtree.
  #                        A client-side mistake cannot widen it, because the
  #                        denial does not happen in our code at all.
  #
  # Per-tenant grants live in docker/mosquitto/config/acl; see that file for why
  # there is deliberately no catch-all and no `fgmp/%u/#` rule.
  #
  # Passwords are DEVELOPMENT credentials, committed on purpose so a developer
  # and the test suite agree without setup. They are worthless outside the
  # loopback listener, and allow_anonymous is false.
  fgmp-broker:
    image: eclipse-mosquitto:2
    container_name: fgmp-broker
    restart: unless-stopped
    ports:
      # Bound to loopback only — this broker is not a production surface.
      # 1885, not the default 1883: other projects on this host already hold
      # 1883/1884, and a hard failure to start is preferable to silently
      # connecting a test to a stranger's broker.
      - "127.0.0.1:1885:1883"
    # ── WHY THESE ARE COPIED, NOT BIND-MOUNTED ──────────────────────────────
    # A bind mount carries the HOST file's uid/gid and mode straight into the
    # container, so /mosquitto/config/acl ends up owned by whoever wrote it on
    # the host (uid 1000) rather than by the mosquitto user (uid 1883).
    #
    # Mosquitto 2 does NOT reject that. It logs six warnings — world readable,
    # owner is not mosquitto, group is not mosquitto, twice over — and then
    # KEEPS RUNNING WITH THE ACL NOT ENFORCED. Authentication still works,
    # because the password file is read by the same mechanism. The result is
    # the most dangerous possible half-working security state: every connection
    # authenticates, and every tenant can subscribe to every other tenant's
    # subtree, while the logs and the healthcheck both look healthy.
    #
    # This was found because the cross-tenant subscribe tests FAILED against a
    # broker that was up and healthy — not by reading the warnings.
    #
    # Copying the files into a named volume at start-up fixes both the owner
    # AND the mode, and an init script chowns them, so the broker loads them
    # under its own identity.
    volumes:
      - broker-config:/mosquitto/config
      # Read-only source for the copy-in above. Deliberately NOT mounted at
      # /mosquitto/config — see the entrypoint comment for why.
      - ./docker/mosquitto/config:/seed:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        cp /seed/mosquitto.conf /mosquitto/config/mosquitto.conf
        cp /seed/acl            /mosquitto/config/acl
        cp /seed/passwd         /mosquitto/config/passwd
        # 0600 owned by mosquitto: the mode mosquitto 2 will actually accept.
        chown mosquitto:mosquitto /mosquitto/config/acl /mosquitto/config/passwd
        chmod 0600 /mosquitto/config/acl /mosquitto/config/passwd
        chmod 0644 /mosquitto/config/mosquitto.conf
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      # Proves the property that actually matters, and — critically — it asserts
      # the ACL is ENFORCED, not merely loaded.
      #
      # The previous probe subscribed with `-C 1`, which waits for one MESSAGE.
      # It ran every 15s against a broker where nobody publishes, so it always
      # timed out: 383 consecutive failures while the container reported
      # "unhealthy" and the broker was in fact serving. A healthcheck that
      # cannot pass is worse than none — it trains everyone to ignore it.
      #
      # This probe asks the broker three questions instead:
      #   1. does tenant-a's credential authenticate?        (it must)
      #   2. is its own subtree granted?                     (it must be)
      #   3. is ANOTHER tenant's subtree refused?           (it must be)
      #
      # Question 3 is the regression test for the ownership bug above. mosquitto
      # grants a denied subscription with QoS 0x80 in the SUBACK, so `-d` output
      # containing 0x80 for the foreign topic is the signal. If the ACL ever
      # stops being enforced again, this goes unhealthy.
      test:
        - CMD-SHELL
        - >-
          out=$$(mosquitto_sub -h 127.0.0.1 -p 1883 -u tenant-a -P dev-tenant-a-pw
          -t 'fgmp/tenant-a/#' -t 'fgmp/tenant-b/#' -d -W 2 2>&1);
          echo "$$out" | grep -q 'SUBACK' || exit 1;
          echo "$$out" | grep -q 'received CONNACK (0)' || exit 1;
          echo "$$out" | grep -qE 'Subscribed \(mid: [0-9]+\): 128' || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s

  fgmp-db:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=${PGMIGRATE_USER:-fgmp_migrate}
      - POSTGRES_PASSWORD=${PGMIGRATE_PASSWORD:?set PGMIGRATE_PASSWORD (openssl rand -hex 24)}
      - POSTGRES_DB=fgmp
      - PGAPP_PASSWORD=${PGAPP_PASSWORD:?set PGAPP_PASSWORD (openssl rand -hex 24)}
      - PGOPS_PASSWORD=${PGOPS_PASSWORD:?set PGOPS_PASSWORD (openssl rand -hex 24)}
      # Deterministic collation so ORDER BY is stable across host locales.
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8
    volumes:
      - fgmp-pgdata:/var/lib/postgresql/data
      # First-boot provisioning only; on an existing volume these do not re-run.
      # The .sh MUST live in /docker-entrypoint-initdb.d or the entrypoint will
      # not execute it. It sorts as 00- so roles exist before any .sql runs.
      # The .sql is referenced by absolute path from the wrapper, because psql
      # cannot read passwords from the environment without --set.
      - ./scripts/pg-init-roles.sh:/docker-entrypoint-initdb.d/00-pg-init-roles.sh:ro
      - ./scripts/pg-init-roles.sql:/opt/fgmp/pg-init-roles.sql:ro
    ports:
      # Bound to loopback: Postgres must not be reachable from the app subnet
      # by accident, only via the compose network. Remove this mapping in
      # production entirely and reach it over the private network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGMIGRATE_USER:-fgmp_migrate} -d fgmp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  fgmp-app:
    build: .
    ports:
      - "3151:3000"
    environment:
      # Phase 1 step 1: the app now runs as fgmp_app (RLS-enforced, NOT the
      # owner). DATABASE_URL must never carry fgmp_ops — see note above.
      - DATABASE_URL=postgresql://fgmp_app:${PGAPP_PASSWORD}@fgmp-db:5432/fgmp?schema=public&connection_limit=10
      - FGMP_OPS_DATABASE_URL=postgresql://fgmp_ops:${PGOPS_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      # ── The web app is NEVER given FGMP_MIGRATE_DATABASE_URL ──────────────
      # Seeding used to run inside bootstrap(), so this container needed an
      # owner (superuser) credential just to serve a request. It now runs at
      # DEPLOY TIME via the `seed` profile below, and the credential lives only
      # in that one-shot container. Do not re-add it here: a superuser URL in
      # this service would let any injection bug bypass RLS entirely.
      #
      # Seeding a fresh environment is an explicit operator step:
      #     docker compose --profile seed run --rm fgmp-seed
      # A deployment that skips it starts against an empty database and the app
      # reports that visibly rather than serving a blank platform.
      #
      # Set to "0" ONLY for local development where no RLS policy exists yet.
      # Any non-zero environment MUST be "1" or the app refuses to start.
      - FGMP_REQUIRE_RLS=${FGMP_REQUIRE_RLS:-1}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (openssl rand -base64 32)}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - IOT_API_KEY=${IOT_API_KEY:?set IOT_API_KEY (openssl rand -hex 32)}
      # ── Realtime (hosted Apinator) ────────────────────────────────────────
      # REALTIME_URL / REALTIME_SERVER_SECRET / REALTIME_TOKEN_SECRET are gone:
      # the self-hosted socket.io mini-service was retired. The app triggers
      # events and authorizes channel subscriptions against Apinator directly;
      # browsers connect to wss://ws-<cluster>.apinator.io (public NEXT_PUBLIC_
      # pair is inlined at build time, so it is not repeated here).
      # REALTIME_SERVICE_TOKEN stays: the iot-bridge authenticates its
      # /api/fgmp/realtime/snapshot polling with it, and that endpoint remains.
      - REALTIME_SERVICE_TOKEN=${REALTIME_SERVICE_TOKEN:?set REALTIME_SERVICE_TOKEN (openssl rand -hex 32)}
      - APINATOR_APP_ID=${APINATOR_APP_ID:?set APINATOR_APP_ID (Apinator dashboard)}
      - APINATOR_KEY=${APINATOR_KEY:?set APINATOR_KEY (Apinator dashboard)}
      - APINATOR_SECRET=${APINATOR_SECRET:?set APINATOR_SECRET (Apinator dashboard)}
      - APINATOR_CLUSTER=${APINATOR_CLUSTER:?set APINATOR_CLUSTER (eu or us)}
    volumes:
      # SQLite volume mount removed in Phase 1 step 1. The /app/db path is
      # retained only because the standalone image expects the directory to
      # exist; nothing is written there any more.
      - fgmp-backups:/app/backups
    depends_on:
      fgmp-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Unauthenticated probe — /api/fgmp/health requires ADMIN, so it would
      # report unhealthy forever. Any HTTP response proves the server is up.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/fgmp/health').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G

  # ── fgmp-realtime REMOVED ─────────────────────────────────────────────────
  # The self-hosted socket.io mini-service (mini-services/realtime, :3003,
  # Caddy /socket.io proxy) was retired in favour of Apinator, a hosted
  # realtime provider. Browsers subscribe to wss://ws-<cluster>.apinator.io
  # directly and channel subscriptions are authorized by the app's realtime
  # auth routes, so nothing in this stack listens on 3003 any more.

  fgmp-iot-bridge:
    build: ./mini-services/iot-bridge
    # No port exposure — this service only makes outbound calls.
    environment:
      - NEXT_API_BASE=http://fgmp-app:3000
      - IOT_API_KEY=${IOT_API_KEY:?set IOT_API_KEY (openssl rand -hex 32)}
      # Snapshot polling token. This was MISSING here before the Apinator
      # migration — the bridge fell back to its dev default in compose
      # deployments and every snapshot poll 401'd. It must match the
      # REALTIME_SERVICE_TOKEN handed to fgmp-app.
      - REALTIME_SERVICE_TOKEN=${REALTIME_SERVICE_TOKEN:?set REALTIME_SERVICE_TOKEN (openssl rand -hex 32)}
      # mTLS (proposal §7): set to 1 and point NEXT_API_BASE at
      # the gateway's internal listener (https://fgmp-app:8443)
      # once scripts/generate-mtls-certs.sh has populated ./certs.
      # The bridge then presents its client certificate on every
      # call; the gateway verifies it against the deployment CA.
      - IOT_BRIDGE_TLS=${IOT_BRIDGE_TLS:-0}
      - IOT_BRIDGE_CA=${IOT_BRIDGE_CA:-/certs/ca.crt}
      - IOT_BRIDGE_CERT=${IOT_BRIDGE_CERT:-/certs/client.crt}
      - IOT_BRIDGE_KEY=${IOT_BRIDGE_KEY:-/certs/client.key}
    volumes:
      # Client identity for the mTLS listener. Generated by
      # scripts/generate-mtls-certs.sh; never commit the keys.
      - ./certs:/certs:ro
    depends_on:
      fgmp-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Deploy-time seeding (one-shot) ────────────────────────────────────────
  # Seeding creates tenants and rows across every one of them, so it cannot run
  # inside withTenant() and needs the owner role. It is deliberately NOT part of
  # the default `up`: the web app must never hold this credential, and a fresh
  # environment is seeded by an explicit operator action.
  #
  #   docker compose --profile seed run --rm fgmp-seed
  #
  # Idempotent — prints {"seeded":false} when the topology already exists.
  # ── Deploy-time seeding (one-shot) ────────────────────────────────────────
  # Seeding creates tenants and rows across every one of them, so it cannot run
  # inside withTenant() and needs the owner role. It is deliberately NOT part of
  # the default `up`: the web app must never hold this credential, and a fresh
  # environment is seeded by an explicit operator action.
  #
  #   docker compose --profile seed run --rm fgmp-seed
  #
  # Idempotent — the seed reports {"seeded":false} when the topology exists, and
  # exits non-zero if it produces no sites, so a broken seed cannot be mistaken
  # for a successful one.
  fgmp-seed:
    profiles: ["seed"]
    # Uses the toolchain image rather than the slim runtime image: the seed is a
    # TypeScript script run with Bun, and the standalone runtime image ships
    # neither the script nor the prisma CLI needed to apply migrations first.
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "fgmp-seed: installing dependencies…"
        bun install --frozen-lockfile
        echo "fgmp-seed: generating Prisma client…"
        bun run db:generate
        echo "fgmp-seed: applying migrations…"
        bun run db:deploy
        echo "fgmp-seed: seeding…"
        bun run db:seed
        echo "fgmp-seed: done."
    environment:
      - DATABASE_URL=postgresql://fgmp_app:${PGAPP_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      - FGMP_MIGRATE_DATABASE_URL=postgresql://fgmp_migrate:${PGMIGRATE_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (openssl rand -base64 32)}
    depends_on:
      fgmp-db:
        condition: service_healthy
    restart: "no"

volumes:
  # SQLite volume — removed in Phase 1 step 1. Retained only so an existing
  # deployment can still reach its old database file during cutover.
  fgmp-db:
  fgmp-backups:
  # PostgreSQL data directory (Phase 1 step 1).
  fgmp-pgdata:
  # Broker configuration, as a VOLUME rather than three bind mounts, so the
  # entrypoint can chown the ACL and password files to the mosquitto user.
  # See the fgmp-broker entrypoint for why a bind mount is unsafe here.
  broker-config:
