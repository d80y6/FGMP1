# FGMP — production stack
#
# Every secret below is REQUIRED and has no fallback. The previous defaults
# (dev-secret-change-me, fgmp-iot-dev-key) shipped in this file and in the
# firmware source, so a deployment that forgot to export them ran on publicly
# known credentials. `${VAR:?message}` makes `docker compose up` fail loudly
# instead.
#
# Generate the secrets once and keep them in your shell / secret manager:
#   openssl rand -base64 32   # NEXTAUTH_SECRET, REALTIME_TOKEN_SECRET
#   openssl rand -hex 32      # IOT_API_KEY, REALTIME_SERVICE_TOKEN, REALTIME_SERVER_SECRET

services:
  # ── PostgreSQL (Phase 1, step 1: SQLite → PostgreSQL) ────────────────────
  # Replaces the SQLite file that backed every model. TimescaleDB is included
  # from step 10 (SensorReadings hypertables); until then this is plain
  # PostgreSQL and the extension is simply unused.
  #
  # THREE ROLES, provisioned on first init by scripts/pg-init-roles.sh:
  #   fgmp_app     — DML only, NOT the table owner, so RLS is enforced (step 6)
  #   fgmp_ops     — BYPASSRLS for internal ops (pg_dump, support investigations)
  #   fgmp_migrate — owns the schema; CI only
  #
  # NOTE: the web app connects as fgmp_app and MUST NOT be given fgmp_ops.
  # If the app ever holds a BYPASSRLS role, one injection bug anywhere would
  # defeat tenant isolation completely. See scripts/pg-init-roles.sql.
  fgmp-db:
    image: timescale/timescaledb:latest-pg17
    environment:
      - POSTGRES_USER=${PGMIGRATE_USER:-fgmp_migrate}
      - POSTGRES_PASSWORD=${PGMIGRATE_PASSWORD:?set PGMIGRATE_PASSWORD (openssl rand -hex 24)}
      - POSTGRES_DB=fgmp
      - PGAPP_PASSWORD=${PGAPP_PASSWORD:?set PGAPP_PASSWORD (openssl rand -hex 24)}
      - PGOPS_PASSWORD=${PGOPS_PASSWORD:?set PGOPS_PASSWORD (openssl rand -hex 24)}
      # Deterministic collation so ORDER BY is stable across host locales.
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8 --encoding=UTF8
    volumes:
      - fgmp-pgdata:/var/lib/postgresql/data
      # First-boot provisioning only; on an existing volume these do not re-run.
      # The .sh MUST live in /docker-entrypoint-initdb.d or the entrypoint will
      # not execute it. It sorts as 00- so roles exist before any .sql runs.
      # The .sql is referenced by absolute path from the wrapper, because psql
      # cannot read passwords from the environment without --set.
      - ./scripts/pg-init-roles.sh:/docker-entrypoint-initdb.d/00-pg-init-roles.sh:ro
      - ./scripts/pg-init-roles.sql:/opt/fgmp/pg-init-roles.sql:ro
    ports:
      # Bound to loopback: Postgres must not be reachable from the app subnet
      # by accident, only via the compose network. Remove this mapping in
      # production entirely and reach it over the private network.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGMIGRATE_USER:-fgmp_migrate} -d fgmp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  fgmp-app:
    build: .
    ports:
      - "3151:3000"
    environment:
      # Phase 1 step 1: the app now runs as fgmp_app (RLS-enforced, NOT the
      # owner). DATABASE_URL must never carry fgmp_ops — see note above.
      - DATABASE_URL=postgresql://fgmp_app:${PGAPP_PASSWORD}@fgmp-db:5432/fgmp?schema=public&connection_limit=10
      - FGMP_OPS_DATABASE_URL=postgresql://fgmp_ops:${PGOPS_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      # ── The web app is NEVER given FGMP_MIGRATE_DATABASE_URL ──────────────
      # Seeding used to run inside bootstrap(), so this container needed an
      # owner (superuser) credential just to serve a request. It now runs at
      # DEPLOY TIME via the `seed` profile below, and the credential lives only
      # in that one-shot container. Do not re-add it here: a superuser URL in
      # this service would let any injection bug bypass RLS entirely.
      #
      # Seeding a fresh environment is an explicit operator step:
      #     docker compose --profile seed run --rm fgmp-seed
      # A deployment that skips it starts against an empty database and the app
      # reports that visibly rather than serving a blank platform.
      #
      # Set to "0" ONLY for local development where no RLS policy exists yet.
      # Any non-zero environment MUST be "1" or the app refuses to start.
      - FGMP_REQUIRE_RLS=${FGMP_REQUIRE_RLS:-1}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (openssl rand -base64 32)}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - IOT_API_KEY=${IOT_API_KEY:?set IOT_API_KEY (openssl rand -hex 32)}
      - REALTIME_URL=http://fgmp-realtime:3003
      - REALTIME_SERVER_SECRET=${REALTIME_SERVER_SECRET:?set REALTIME_SERVER_SECRET (openssl rand -hex 32)}
      - REALTIME_SERVICE_TOKEN=${REALTIME_SERVICE_TOKEN:?set REALTIME_SERVICE_TOKEN (openssl rand -hex 32)}
      - REALTIME_TOKEN_SECRET=${REALTIME_TOKEN_SECRET:?set REALTIME_TOKEN_SECRET (openssl rand -base64 32)}
    volumes:
      # SQLite volume mount removed in Phase 1 step 1. The /app/db path is
      # retained only because the standalone image expects the directory to
      # exist; nothing is written there any more.
      - fgmp-backups:/app/backups
    depends_on:
      fgmp-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Unauthenticated probe — /api/fgmp/health requires ADMIN, so it would
      # report unhealthy forever. Any HTTP response proves the server is up.
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/fgmp/health').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2G

  fgmp-realtime:
    build: ./mini-services/realtime
    # NOTE: port 3003 is deliberately NOT published to the host. It used to be
    # exposed, which bypassed the Caddy gateway and made the socket reachable
    # directly. Browsers reach it through Caddy at /socket.io.
    expose:
      - "3003"
    environment:
      # These names matter: the service reads NEXT_API_BASE / REALTIME_ORIGIN.
      # The file previously set NEXTJS_URL / CORS_ORIGIN, which nothing read,
      # so both mini-services fell back to localhost:3000 — themselves — and
      # spun in permanent error loops.
      - NEXT_API_BASE=http://fgmp-app:3000
      - REALTIME_ORIGIN=${REALTIME_ORIGIN:-http://localhost:3000}
      - REALTIME_SERVER_SECRET=${REALTIME_SERVER_SECRET:?set REALTIME_SERVER_SECRET (openssl rand -hex 32)}
      - REALTIME_SERVICE_TOKEN=${REALTIME_SERVICE_TOKEN:?set REALTIME_SERVICE_TOKEN (openssl rand -hex 32)}
      - REALTIME_TOKEN_SECRET=${REALTIME_TOKEN_SECRET:?set REALTIME_TOKEN_SECRET (openssl rand -base64 32)}
    depends_on:
      fgmp-app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  fgmp-iot-bridge:
    build: ./mini-services/iot-bridge
    # No port exposure — this service only makes outbound calls.
    environment:
      - NEXT_API_BASE=http://fgmp-app:3000
      - REALTIME_ORIGIN=${REALTIME_ORIGIN:-http://localhost:3000}
      - IOT_API_KEY=${IOT_API_KEY:?set IOT_API_KEY (openssl rand -hex 32)}
      - REALTIME_SERVER_SECRET=${REALTIME_SERVER_SECRET:?set REALTIME_SERVER_SECRET (openssl rand -hex 32)}
    depends_on:
      fgmp-app:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Deploy-time seeding (one-shot) ────────────────────────────────────────
  # Seeding creates tenants and rows across every one of them, so it cannot run
  # inside withTenant() and needs the owner role. It is deliberately NOT part of
  # the default `up`: the web app must never hold this credential, and a fresh
  # environment is seeded by an explicit operator action.
  #
  #   docker compose --profile seed run --rm fgmp-seed
  #
  # Idempotent — prints {"seeded":false} when the topology already exists.
  # ── Deploy-time seeding (one-shot) ────────────────────────────────────────
  # Seeding creates tenants and rows across every one of them, so it cannot run
  # inside withTenant() and needs the owner role. It is deliberately NOT part of
  # the default `up`: the web app must never hold this credential, and a fresh
  # environment is seeded by an explicit operator action.
  #
  #   docker compose --profile seed run --rm fgmp-seed
  #
  # Idempotent — the seed reports {"seeded":false} when the topology exists, and
  # exits non-zero if it produces no sites, so a broken seed cannot be mistaken
  # for a successful one.
  fgmp-seed:
    profiles: ["seed"]
    # Uses the toolchain image rather than the slim runtime image: the seed is a
    # TypeScript script run with Bun, and the standalone runtime image ships
    # neither the script nor the prisma CLI needed to apply migrations first.
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "fgmp-seed: installing dependencies…"
        bun install --frozen-lockfile
        echo "fgmp-seed: generating Prisma client…"
        bun run db:generate
        echo "fgmp-seed: applying migrations…"
        bun run db:deploy
        echo "fgmp-seed: seeding…"
        bun run db:seed
        echo "fgmp-seed: done."
    environment:
      - DATABASE_URL=postgresql://fgmp_app:${PGAPP_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      - FGMP_MIGRATE_DATABASE_URL=postgresql://fgmp_migrate:${PGMIGRATE_PASSWORD}@fgmp-db:5432/fgmp?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET (openssl rand -base64 32)}
    depends_on:
      fgmp-db:
        condition: service_healthy
    restart: "no"

volumes:
  # SQLite volume — removed in Phase 1 step 1. Retained only so an existing
  # deployment can still reach its old database file during cutover.
  fgmp-db:
  fgmp-backups:
  # PostgreSQL data directory (Phase 1 step 1).
  fgmp-pgdata:
